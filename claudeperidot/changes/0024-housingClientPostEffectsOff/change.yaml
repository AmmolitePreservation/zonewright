title: housingclient's eqclient.ini turns post effects off ([Defaults]PostEffects=0) for a settings-sensitivity shot set
why: >-
  The spare (as the owner's client) runs with PostEffects=1 and Bloom=1, post effects on the back buffer that the
  preview does not draw and that could brighten every shot. The rendering-fidelity set retakes a few of its spots
  with them off to measure what they change; reverted right after, restoring PostEffects=1. Apply and undo run with
  the spare closed (the client rewrites eqclient.ini when it exits).
kind: client
scope:
  - S:\Research\EverQuest\housingclient\eqclient.ini
disposition: exploration
significance: minor
ownerClearance: pending
activation: the spare's next launch
production: none
commits: []
steps:
  - |-
    $path = 'S:\Research\EverQuest\housingclient\eqclient.ini'
    $settings = @(,@('Defaults', 'PostEffects', '0'))
    $encoding = [Text.Encoding]::GetEncoding(28591)
    $lines = [IO.File]::ReadAllText($path, $encoding) -split "`r`n"
    foreach ($setting in $settings) {
      $section = ''
      $found = $false
      for ($index = 0; $index -lt $lines.Count; $index++) {
        if ($lines[$index] -match '^\[(.+)\]$') { $section = $Matches[1] }
        elseif ($section -eq $setting[0] -and $lines[$index] -match ('^' + $setting[1] + '=')) { $lines[$index] = $setting[1] + '=' + $setting[2]; $found = $true }
      }
      if (-not $found) { throw ('[' + $setting[0] + ']' + $setting[1] + ' is not in ' + $path) }
    }
    [IO.File]::WriteAllText($path, ($lines -join "`r`n"), $encoding)
undo:
  - |-
    $path = 'S:\Research\EverQuest\housingclient\eqclient.ini'
    $settings = @(,@('Defaults', 'PostEffects', '1'))
    $encoding = [Text.Encoding]::GetEncoding(28591)
    $lines = [IO.File]::ReadAllText($path, $encoding) -split "`r`n"
    foreach ($setting in $settings) {
      $section = ''
      $found = $false
      for ($index = 0; $index -lt $lines.Count; $index++) {
        if ($lines[$index] -match '^\[(.+)\]$') { $section = $Matches[1] }
        elseif ($section -eq $setting[0] -and $lines[$index] -match ('^' + $setting[1] + '=')) { $lines[$index] = $setting[1] + '=' + $setting[2]; $found = $true }
      }
      if (-not $found) { throw ('[' + $setting[0] + ']' + $setting[1] + ' is not in ' + $path) }
    }
    [IO.File]::WriteAllText($path, ($lines -join "`r`n"), $encoding)
checks:
  - path: S:\Research\EverQuest\housingclient\eqclient.ini
    section: Defaults
    key: PostEffects
    value: "0"
