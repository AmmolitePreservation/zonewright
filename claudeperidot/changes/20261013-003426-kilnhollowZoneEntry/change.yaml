    sha256: 05e71a131465d9c6263aa55ee87fbce1514a567154cb6bcad3eff6e489628993
  - path: S:\Research\EverQuest\housingclient\eqstr_us.txt
    sha256: 9f2dbb75550339c4cb704095ddad62de41cd00ad872bace6779564b66f349a95
