title: housingclient's eqclient.ini hides NPC and player names ([Options]NPCNames=0, PCNames=0)
why: >-
  Calibration shots hide the UI, but the client still draws nameplates over NPCs (and other players), which the
  renderer does not and should not draw, so they show as differences. The spare's values were NPCNames=1 and
  PCNames=1, as the owner's. The client rewrites eqclient.ini when it exits, so apply and undo run with the spare
  closed and the checks read the keys.
kind: client
scope:
  - S:\Research\EverQuest\housingclient\eqclient.ini
disposition: exploration
significance: minor
ownerClearance: pending
activation: the spare's next launch
production: none
commits: []
steps:
  - |-
    $path = 'S:\Research\EverQuest\housingclient\eqclient.ini'
    $settings = @(@('Options', 'NPCNames', '0'), @('Options', 'PCNames', '0'))
    $encoding = [Text.Encoding]::GetEncoding(28591)
    $lines = [IO.File]::ReadAllText($path, $encoding) -split "`r`n"
    foreach ($setting in $settings) {
      $section = ''
      $found = $false
      for ($index = 0; $index -lt $lines.Count; $index++) {
        if ($lines[$index] -match '^\[(.+)\]$') { $section = $Matches[1] }
        elseif ($section -eq $setting[0] -and $lines[$index] -match ('^' + $setting[1] + '=')) { $lines[$index] = $setting[1] + '=' + $setting[2]; $found = $true }
      }
      if (-not $found) { throw ('[' + $setting[0] + ']' + $setting[1] + ' is not in ' + $path) }
    }
    [IO.File]::WriteAllText($path, ($lines -join "`r`n"), $encoding)
undo:
  - |-
    $path = 'S:\Research\EverQuest\housingclient\eqclient.ini'
    $settings = @(@('Options', 'NPCNames', '1'), @('Options', 'PCNames', '1'))
    $encoding = [Text.Encoding]::GetEncoding(28591)
    $lines = [IO.File]::ReadAllText($path, $encoding) -split "`r`n"
    foreach ($setting in $settings) {
      $section = ''
      $found = $false
      for ($index = 0; $index -lt $lines.Count; $index++) {
        if ($lines[$index] -match '^\[(.+)\]$') { $section = $Matches[1] }
        elseif ($section -eq $setting[0] -and $lines[$index] -match ('^' + $setting[1] + '=')) { $lines[$index] = $setting[1] + '=' + $setting[2]; $found = $true }
      }
      if (-not $found) { throw ('[' + $setting[0] + ']' + $setting[1] + ' is not in ' + $path) }
    }
    [IO.File]::WriteAllText($path, ($lines -join "`r`n"), $encoding)
checks:
  - path: S:\Research\EverQuest\housingclient\eqclient.ini
    section: Options
    key: NPCNames
    value: "0"
  - path: S:\Research\EverQuest\housingclient\eqclient.ini
    section: Options
    key: PCNames
    value: "0"
