title: Account 86 holds Claudewright and the seven sample body characters (Measurehum, Measureelf, Measuredwm, Measureogm, Measuregnf,
  Measurekef, Measuredkm); the other 25 body characters and the extra accounts 87 and 88 with their logins are gone
why: >-
  The owner wants a representative sample, not every race and gender: each body group's tallest, shortest, widest and thinnest,
  height being the avatarHeight the client tests. That is seven characters (small: dwarf male, gnome female; medium: drakkin male,
  wood elf female, human male; large: ogre male, vah shir female), which fit one account with Claudewright under RoF2's 12 per
  account. This deletes the other 25 characters of 20261012-230620 with every row play gave them (bind, skills, languages,
  currency, pet info, alternate abilities, stats record, experience modifiers), moves the five sample characters on accounts 87
  and 88 to 86, and deletes accounts 87 and 88, their account_ip rows, and their login server accounts (login_accounts 86 and 87).
  player_event_logs keeps its rows: it is the record of what was done.
