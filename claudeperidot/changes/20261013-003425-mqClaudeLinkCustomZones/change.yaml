title: MQClaudeLink 0.9 (claudelink 68fc328) in the plugins folder, which adds the zones in the spare's claudelinkZones.json to the spare's own zone table through the client's EQWorldData::AddZone
why: >-
  The RoF2 client's zone table is built into eqgame.exe: EQWorldData's constructor (eqgame 0x7dca10, called once at
  0x535fd2 while the client sets up its display after the login screen) calls EQWorldData::AddZone (0x7dc430) for each
  zone up to interiorwalltest (767), so the client knows no zone 787 and cannot enter Kilnhollow. EQEmu's documented
  route (eqemu-docs-v2 client/guides/custom-zone-editing.md) is xackery/eq-core-dll, a dinput8.dll whose core_zone.h
  detours AddZone and the EQZoneInfo constructor (0x7dc290) at those same addresses and adds each
  ZoneEntry(zoneType, zoneID, zoneShortName, zoneLongName, eqStrID, zoneFlags2, x, y, z) of its _options.h after
  interiorwalltest. The owner chose not to build eq-core-dll for now but to do it through claudelink, replicable for
  production and not too hacky. MQClaudeLink 0.9 does the same registration in the spare's process only (its spare
  gate is unchanged: anywhere else it does nothing): at InitializePlugin it reads claudelinkZones.json beside
  eqgame.exe, a JSON array holding exactly ZoneEntry's nine fields under eq-core-dll's names, and refuses a malformed
  file; once the client's world data exists (checked at plugin start, each game-state change and each pulse) it checks
  AddZone's first 16 code bytes against the RoF2 client's and every entry against the client's table (an id or short
  name the client already registers refuses them all), calls the client's own AddZone on the client's world data for
  each entry, as the client itself does, and reads each back. Its zones command (and the MCP's zones tool) reports the
  file, the stage, each entry's eq-core-dll line and the entry as the client's table holds it. eq-core-dll's last four
  ZoneEntry names are not what the client does with them: zoneFlags2 is the low half of the zone's 64-bit flags, x the
  high half, y the access level, z the minimum level. To replicate in production: build eq-core-dll with
  areCustomZonesEnabled = true and the zones file's entries in its Zones[] (for Kilnhollow, change
  20261013-003426-kilnhollowZoneEntry: ZoneEntry(0, 787, "kilnhollow", "Kilnhollow", 35154, 4, 0, 0, 0), with the
  eqstr_us.txt line 35154 Kilnhollow), and ship its dinput8.dll with that eqstr_us.txt; this DLL is not shipped. The DLL was
  built from claudelink 68fc328 (Release, Win32, only the MQClaudeLink project, into its own folder) and kept with its
  .pdb in %LOCALAPPDATA%\claudelink\builds\mqClaudeLink-68fc328; the build it replaces is 20261012-222124's, kept in
  %LOCALAPPDATA%\claudelink\builds\mqClaudeLink-9583824, which the undo copies back. The steps refuse while the spare
  runs, since it holds the DLL loaded.
kind: client
scope:
  - ~\LocalProjects\mqPeridot\build\bin\release\plugins\MQClaudeLink.dll
  - ~\LocalProjects\mqPeridot\build\bin\release\plugins\MQClaudeLink.pdb
  - ~\AppData\Local\claudelink\builds\mqClaudeLink-68fc328
disposition: fixture
significance: minor
ownerClearance:
  ownerMessage: '2026-10-12, the owner on Kilnhollow''s client side: "yes, that''s your baby. have at it. just make sure you know what you did so you can replicate it if/when we start using this in production and don''t make it too hacky"; and on registering the zone: "option b. no need to compile new code if it''s just a temporary solution and you can do it via claudelink"'
activation: the spare's next launch
production: none
commits: []
steps:
  - |-
    $spare = 'S:\Research\EverQuest\housingclient'
    $running = @(Get-CimInstance Win32_Process -Filter "Name='eqgame.exe'" | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($spare + '\', [StringComparison]::OrdinalIgnoreCase) })
    if ($running.Count -gt 0) { throw ("close the spare first; running: " + (($running | ForEach-Object { $_.ProcessId }) -join ', ')) }
    $plugins = "$env:USERPROFILE\LocalProjects\mqPeridot\build\bin\release\plugins"
    $builds = "$env:LOCALAPPDATA\claudelink\builds"
    $expected = @{
      "$builds\mqClaudeLink-68fc328\MQClaudeLink.dll" = 'b829d0300262b63a238fc77829517f7a01ce9b1d4d74012a47b0a512aca1f946'
      "$builds\mqClaudeLink-68fc328\MQClaudeLink.pdb" = '4358dfab70443b839a69a669820ae08ffd8f805d095d8458e71b8002a39e7409'
      "$builds\mqClaudeLink-9583824\MQClaudeLink.dll" = '4785e91ed702d8c21f612a91e03679de75135722f7553de75063e6f74b6070f6'
      "$builds\mqClaudeLink-9583824\MQClaudeLink.pdb" = '024e0871f258ccde5493d750d3225ca76dc7c4add32d905811e2fcfd80cf679d'
      "$plugins\MQClaudeLink.dll" = '4785e91ed702d8c21f612a91e03679de75135722f7553de75063e6f74b6070f6'
    }
    foreach ($path in $expected.Keys) {
      if ((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash -ne $expected[$path]) { throw "$path is not the file this change was recorded with" }
    }
    Copy-Item -LiteralPath "$builds\mqClaudeLink-68fc328\MQClaudeLink.dll", "$builds\mqClaudeLink-68fc328\MQClaudeLink.pdb" -Destination $plugins -Force
