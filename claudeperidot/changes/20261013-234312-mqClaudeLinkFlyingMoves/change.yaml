title: MQClaudeLink 1.0 (claudelink 394b0a1) in the plugins folder, whose teleport arrives on y, x and z and sends no move when the character is already there
why: >-
  A face right after a teleport was lost when the character already stood at the spot (a zone change straight to a shot's
  spot, then a teleport there): the teleport's arrival check, y and x within 2 units, passed before the #goto landed, so it
  replied at once and the server's move, carrying the heading the server holds, landed after the face and turned the
  character back to it (East Freeport and Plane of Knowledge shots of 2026-10-13 came out facing 0 until faced again).
  MQClaudeLink 1.0's teleport sends no move when the character is already within 2 units of the spot in y, x and z, and
  faces at once; otherwise it waits for y, x and z within 2 units, then faces, as before; its reply adds moved (1 or 0).
  The MCP side (no ledger change of its own, as with plain walking's resets) now turns flymode on before every teleport
  and zone change and reads it back (zone again on arrival), the owner's word below, so account 86's GM flymode reads 1
  after a move and 0 after a walk, which still sets it back to 0 first; 0016 recorded it 0. The DLL was built from
  claudelink 394b0a1 (Release, Win32, only the MQClaudeLink project, into its own folder) and kept with its .pdb in
  %LOCALAPPDATA%\claudelink\builds\mqClaudeLink-394b0a1; the build it replaces is 20261013-003425's, kept in
  %LOCALAPPDATA%\claudelink\builds\mqClaudeLink-68fc328, which the undo copies back. The steps refuse while the spare
  runs, since it holds the DLL loaded.
kind: client
scope:
  - ~\LocalProjects\mqPeridot\build\bin\release\plugins\MQClaudeLink.dll
  - ~\LocalProjects\mqPeridot\build\bin\release\plugins\MQClaudeLink.pdb
  - ~\AppData\Local\claudelink\builds\mqClaudeLink-394b0a1
disposition: fixture
significance: minor
ownerClearance:
  ownerMessage: '2026-10-13, the owner on the lost face after a teleport and on flying: "fix that and while you''re at it look at the screenshot tools so that any time it moves to take a screenshot it turns on flight mode so it doesn''t fall to its death. no weird math about height or whatever. and any modes that require flight mode to be off need to set it to off at the beginning like swimming checks and climbing checks for example."'
activation: the spare's next launch
production: none
commits: []
steps:
  - |-
    $spare = 'S:\Research\EverQuest\housingclient'
    $running = @(Get-CimInstance Win32_Process -Filter "Name='eqgame.exe'" | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($spare + '\', [StringComparison]::OrdinalIgnoreCase) })
    if ($running.Count -gt 0) { throw ("close the spare first; running: " + (($running | ForEach-Object { $_.ProcessId }) -join ', ')) }
    $plugins = "$env:USERPROFILE\LocalProjects\mqPeridot\build\bin\release\plugins"
    $builds = "$env:LOCALAPPDATA\claudelink\builds"
    $expected = @{
      "$builds\mqClaudeLink-394b0a1\MQClaudeLink.dll" = 'e492ffe165a8f0d210d5304845ace9672eaa801f077f4440313e98dfe5222f11'
      "$builds\mqClaudeLink-394b0a1\MQClaudeLink.pdb" = '4dea06b087c32d310b399efb09dc79642238156efbcecc2be1493ee6d693fa46'
      "$builds\mqClaudeLink-68fc328\MQClaudeLink.dll" = 'b829d0300262b63a238fc77829517f7a01ce9b1d4d74012a47b0a512aca1f946'
      "$builds\mqClaudeLink-68fc328\MQClaudeLink.pdb" = '4358dfab70443b839a69a669820ae08ffd8f805d095d8458e71b8002a39e7409'
      "$plugins\MQClaudeLink.dll" = 'b829d0300262b63a238fc77829517f7a01ce9b1d4d74012a47b0a512aca1f946'
    }
    foreach ($path in $expected.Keys) {
      if ((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash -ne $expected[$path]) { throw "$path is not the file this change was recorded with" }
    }
    Copy-Item -LiteralPath "$builds\mqClaudeLink-394b0a1\MQClaudeLink.dll", "$builds\mqClaudeLink-394b0a1\MQClaudeLink.pdb" -Destination $plugins -Force
undo:
