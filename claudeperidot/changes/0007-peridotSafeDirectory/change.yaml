title: Peridot's /root/.gitconfig no longer holds [safe] directory = /opt/eqemu/akk-stack/code, and is empty
why: The owner's answer 8 asked for the safe.directory leftover to be removed after the first read step; it named the code checkout rather than the '*' the answer described, and the owner confirmed its removal on 2026-10-11.
kind: lab
scope:
  - /root/.gitconfig on peridot
disposition: fixture
significance: minor
ownerClearance:
  ownerMessage: '2026-10-11, the owner''s later answer: the /root/.gitconfig [safe] section on Peridot, removed'
activation: none
production: none
commits: []
steps:
  - via: facet run
    host: peridot
    run: sudo git config --file /root/.gitconfig --remove-section safe
undo:
  - via: facet run
    host: peridot
    run: sudo git config --file /root/.gitconfig --add safe.directory /opt/eqemu/akk-stack/code
checks:
  - via: facet run
    host: peridot
    run: sudo git config --file /root/.gitconfig --get-all safe.directory; echo "exit $?"; sudo wc -c < /root/.gitconfig
    expect: '"exit 1" with no directory before it, then 0: no safe.directory and an empty file'
author:
  session: session_0121Qm1vvZgAKaiV6dKmANxe
