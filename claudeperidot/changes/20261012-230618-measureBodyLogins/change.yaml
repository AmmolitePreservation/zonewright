title: Credential Manager holds claudeperidot/eqLogin2 and eqLogin3, two more spare logins on claudeperidot, and the owner's MacroQuest
  config folder holds claudeperidot_<name>.cfg for each of the 32 body characters Measurehum to Measuredkf, identical to Claudewright's
why: 'Every playable race and gender gets its own permanent character for the player measurement walks (plan step 22), instead of rewriting
  Claudewright''s race for each body. RoF2''s character select lists 12 characters per account (EQEmu ae4bd2833 common/patches/rof2_limits.h
  CHARACTER_CREATION_LIMIT, applied as ORDER BY name LIMIT 12 in world/worlddb.cpp GetCharSelectInfo and again at enter world, world/client.cpp:854),
  so the 32 bodies and Claudewright need three accounts: account 86 (claudeperidot/eqLogin) keeps Claudewright and takes 11, and two
  new logins take 12 and 9. The first step makes their credentials exactly as 0012 made claudeperidot/eqLogin (a generated account name,
  claude plus six lowercase letters and digits, and a 15-character password of letters and digits, stored only in Credential Manager);
  the login server creates each account at its first login (auto_create_accounts), which is play, and claudelink''s launchClient takes
  the target as its account argument (claudelink b7b2b96). The second step writes each body character''s MacroQuest cfg with 0013''s
  content, so MacroQuest unloads mq2netbots and MQ2EQBC (AutoConnect to the owner''s EQBCS on Peridot) and loads MQClaudeLink, each
  with noauto, before any plugin hears the character enter the world (MQPluginHandler.cpp PluginsSetGameState): InGame.cfg is the owner''s,
  so a per-character cfg is the only place, and it must exist before the character first enters the world. MacroQuest and its plugins
  write claudeperidot_<name>.ini beside each as the character plays; the undo removes those too.'
