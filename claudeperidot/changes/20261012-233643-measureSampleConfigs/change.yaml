title: The owner's MacroQuest config folder holds claudeperidot_<name>.cfg for each of the seven sample body characters, identical to Claudewright's
why: The seven sample body characters (plan step 22, 20261012-233442) enter the world on account 86; each needs 0013's cfg so MacroQuest unloads
  mq2netbots and MQ2EQBC (AutoConnect to the owner's EQBCS on Peridot) and loads MQClaudeLink before any plugin hears the character enter the
  world. 20261012-230618 made these for all 32 bodies and two more logins and was reverted when the bodies were cut to the sample. MacroQuest
  writes claudeperidot_<name>.ini beside each as the character plays; the undo removes those too.
kind: client
scope:
- ~\LocalProjects\mqPeridot\build\bin\release\config\claudeperidot_Measurehum.cfg
- ~\LocalProjects\mqPeridot\build\bin\release\config\claudeperidot_Measureelf.cfg
- ~\LocalProjects\mqPeridot\build\bin\release\config\claudeperidot_Measuredwm.cfg
- ~\LocalProjects\mqPeridot\build\bin\release\config\claudeperidot_Measureogm.cfg
- ~\LocalProjects\mqPeridot\build\bin\release\config\claudeperidot_Measuregnf.cfg
- ~\LocalProjects\mqPeridot\build\bin\release\config\claudeperidot_Measurekef.cfg
- ~\LocalProjects\mqPeridot\build\bin\release\config\claudeperidot_Measuredkm.cfg
