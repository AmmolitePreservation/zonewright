- ~\LocalProjects\mqPeridot\build\bin\release\config\claudeperidot_Measuredkm.ini
disposition: fixture
significance: minor
ownerClearance:
  ownerMessage: '2026-10-12, the owner on the 32 body characters: "great and this should fit in a single account now right?" then "no, not once
    they''re finished, now. fuckin'' clean that shit up."'
activation: each sample body character's next entry into the world
production: none
commits: []
steps:
- "$config = \"$env:USERPROFILE\\LocalProjects\\mqPeridot\\build\\bin\\release\\config\"\n$names = @('Measurehum', 'Measureelf', 'Measuredwm',\
  \ 'Measureogm', 'Measuregnf', 'Measurekef', 'Measuredkm')\n$content = \"/plugin mq2netbots unload noauto`r`n/plugin MQ2EQBC unload noauto`r`n/plugin\
  \ MQClaudeLink load noauto`r`n\"\nforeach ($name in $names) {\n  if (Test-Path -LiteralPath \"$config\\claudeperidot_$name.cfg\") { throw \"\
  $config\\claudeperidot_$name.cfg already exists; this change only creates it\" }\n}\nforeach ($name in $names) {\n  [IO.File]::WriteAllText(\"\
  $config\\claudeperidot_$name.cfg\", $content, (New-Object System.Text.ASCIIEncoding))\n}"
undo:
- "$config = \"$env:USERPROFILE\\LocalProjects\\mqPeridot\\build\\bin\\release\\config\"\n$names = @('Measurehum', 'Measureelf', 'Measuredwm',\
  \ 'Measureogm', 'Measuregnf', 'Measurekef', 'Measuredkm')\nforeach ($name in $names) {\n  $path = \"$config\\claudeperidot_$name.cfg\"\n  $hash\
  \ = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()\n  if ($hash -ne 'b25878ecbd5521f722f1ff2bd64318e6fe60b28ec67e06c9b5985fb77f07a3cf')\
  \ { throw \"$path changed since apply (sha256 $hash)\" }\n}\nforeach ($name in $names) {\n  Remove-Item -LiteralPath \"$config\\claudeperidot_$name.cfg\"\
  \n  if (Test-Path -LiteralPath \"$config\\claudeperidot_$name.ini\") { Remove-Item -LiteralPath \"$config\\claudeperidot_$name.ini\" }\n}"
