why: >-
  Design #10's walks (plan step 19) measure each body group's limiting bodies in arttest; the dwarf male is the small group's tallest and widest body (model 5.22 high, 3.10 wide). The client
  sizes the player's own spawn itself from its race and gender (the server sends size 0), and a #race illusion leaves the
  client's avatarHeight at the human's 3.75 (tried in arttest 2026-10-12: race 12 shown, avatarHeight and height unchanged),
  so the character's real race and gender change, written with the spare closed. Claudewright stays a wizard: neither the
  server nor the client checks race and class when an existing character logs in. A later change (the next body, then
  claudewrightHumanAgain) writes the row again; this one cannot revert by the ledger once play rewrites the row.
