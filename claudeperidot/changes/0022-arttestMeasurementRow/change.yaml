title: The arttest zone row (id 996) describes the measurement zone of design #10, as its game export's arttest.sql writes it
why: >-
  The measurement zone (0021) loads in the client's unused arttest slot. Its zone row already exists on claudeperidot (Art
  Testing Domain, min_status 80, no zone_points, spawns, or doors), so the export's arttest.sql takes its update branch: the safe
  point at the start line (zone 200, -20, 0, facing +y), underworld -60, clips 450 to 1500, sky 1, outdoor, entry for status 80
  and up (Claudewright has GM status, 0016). apply.sql is that UPDATE, the statement arttest.sql runs when the row exists; the
  ledger stages the row and writes the revert from it.
kind: db
scope:
  - table: zone
    where: short_name = 'arttest' AND version = 0
disposition: exploration
significance: minor
ownerClearance: pending
activation: restart world and the zone processes (world reads the zone table at boot, a zone process its row when it boots)
production: none
commits: []
